[package]
name = "son-of-w"
version = "1.0.0"
edition = "2021"
description = "One memory for every AI agent: a local store of decisions, patterns, facts and todos"
homepage = "https://son-of-w.com"
repository = "https://github.com/son-of-w/son"
license = "MIT"
readme = "README.md"
keywords = ["ai", "agents", "memory", "cli", "sqlite"]
categories = ["command-line-utilities", "development-tools"]
# What `cargo install son-of-w` needs: the source and the tests. The
# evaluation kit, the artwork and the release scripts stay in the repository.
exclude = ["/assets", "/eval", "/dist", "/scripts", "/.github", "/CLAUDE.md"]

[[bin]]
name = "son"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
dialoguer = "0.12.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
rust-stemmers = "1.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ulid = "3.0.0"
unicode-normalization = "0.1.26"

[profile.release]
lto = true
strip = true
