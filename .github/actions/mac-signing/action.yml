name: Set up Mac signing
description: >
  Put the Developer ID Application certificate into a keychain that exists
  only for this job, and write the App Store Connect API key to a file, so
  that scripts/release.sh can sign the Mac binaries and have Apple notarize
  them. Sets SON_NOTARY_KEY for the steps that follow.

# The values come from repository secrets (set with `gh secret set`):
#   MACOS_CERT_P12        the Developer ID Application certificate and its
#                         key, exported as .p12, then base64
#   MACOS_CERT_PASSWORD   the password of that .p12
#   NOTARY_KEY_P8         the App Store Connect API key file (.p8)
# The key id and issuer id (NOTARY_KEY_ID, NOTARY_ISSUER_ID) are given to
# scripts/release.sh directly, as SON_NOTARY_KEY_ID and SON_NOTARY_ISSUER.
inputs:
  cert-p12:
    description: The certificate and its key as a base64 .p12
    required: true
  cert-password:
    description: The password of the .p12
    required: true
  notary-key-p8:
    description: The contents of the App Store Connect API key file
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        MACOS_CERT_P12: ${{ inputs.cert-p12 }}
        MACOS_CERT_PASSWORD: ${{ inputs.cert-password }}
        NOTARY_KEY_P8: ${{ inputs.notary-key-p8 }}
      run: |
        if [ -z "$MACOS_CERT_P12" ] || [ -z "$MACOS_CERT_PASSWORD" ] || [ -z "$NOTARY_KEY_P8" ]; then
          echo "The signing secrets are not set; see .github/actions/mac-signing/action.yml." >&2
          exit 1
        fi
        keychain="$RUNNER_TEMP/signing.keychain-db"
        password="$(openssl rand -hex 24)"
        security create-keychain -p "$password" "$keychain"
        security set-keychain-settings -lut 3600 "$keychain"
        security unlock-keychain -p "$password" "$keychain"
        # Apple's intermediate certificate, which the .p12 does not hold.
        curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
          -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
        security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
        printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
          -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
        rm "$RUNNER_TEMP/cert.p12"
        # Let codesign use the key without a prompt.
        security set-key-partition-list -S apple-tool:,apple: -s \
          -k "$password" "$keychain" >/dev/null
        security list-keychains -d user -s "$keychain" \
          $(security list-keychains -d user | tr -d '"')
        printf '%s\n' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
        echo "SON_NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
