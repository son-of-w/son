name: Release

# Runs when a version tag is pushed, for example:
#   git tag v0.1.0 && git push origin v0.1.0
# The tag must match the version in Cargo.toml.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches Cargo.toml
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Test
        run: cargo test --locked

      - name: Build
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Package
        run: |
          mkdir dist
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            tar -czf "dist/son-$TAG-$target.tar.gz" -C "target/$target/release" son
          done
          cd dist
          shasum -a 256 *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # Safe to run again at any point: each part does nothing if it is
      # already done, and each is tried up to four times, because GitHub's
      # own services sometimes fail for a moment.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          retry() {
            attempt=1
            until "$@"; do
              if [ "$attempt" -ge 4 ]; then
                echo "gave up after $attempt attempts: $*" >&2
                return 1
              fi
              echo "attempt $attempt failed; trying again in $((attempt * 15))s: $*" >&2
              sleep $((attempt * 15))
              attempt=$((attempt + 1))
            done
          }

          # A draft, so nothing is public until every file is uploaded.
          ensure_release() {
            gh release view "$TAG" >/dev/null 2>&1 ||
              gh release create "$TAG" --draft --title "son $TAG" --generate-notes --verify-tag
          }

          retry ensure_release
          retry gh release upload "$TAG" dist/* --clobber
          retry gh release edit "$TAG" --draft=false
